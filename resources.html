  <style>
    /* ============================================ */
    /* GLOBAL VARIABLES & SHARED STYLES             */
    /* ============================================ */
    :root {
      --primary-green: #139B48;
      --primary-yellow: #FFD100;
      --text-dark: #1a1a1a;
      --text-medium: #4a4a4a;
      --text-light: #666666;
      --bg-light: #f8f9fa;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      overflow-x: hidden;
      background-color: var(--bg-light);
    }

    /* CUSTOM MOVEMENT & SCROLL ANIMATIONS */
    .scroll-reveal {
      opacity: 0;
      transform: translateY(40px) scale(0.98);
      transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1), transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: opacity, transform;
    }

    .scroll-reveal.is-visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .delay-1 { transition-delay: 0.1s; }
    .delay-2 { transition-delay: 0.2s; }
    .delay-3 { transition-delay: 0.3s; }

    /* FLUID SCROLL HEADERS */
    .fluid-header-container {
      position: relative;
      width: 100%;
    }

    .fluid-header-inner {
      will-change: transform, opacity;
      opacity: 0;
      transform: translateY(60px) scale(0.85);
    }

    .section-header-center {
      text-align: center;
      margin-bottom: 5rem;
      z-index: 10;
    }

    .section-header-center h2 {
      font-size: clamp(2.2rem, 4vw, 3rem);
      font-weight: 700;
      color: var(--text-dark);
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
    }

    /* ODOMETER FLIP EFFECT FOR HEADERS */
    .flip-wrapper {
      display: inline-block;
      overflow: hidden;
      vertical-align: bottom;
      padding: 0.1em;
      margin: -0.1em;
    }

    .flip-word {
      display: inline-block;
      opacity: 0;
      transform: translateY(110%) rotateX(-45deg);
      transform-origin: 50% 50%;
      will-change: transform, opacity;
    }

    .is-visible .flip-word,
    .fluid-header-inner.is-revealed .flip-word {
      animation: odometerRoll 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    .flip-word-1 { animation-delay: 0.0s; }
    .flip-word-2 { animation-delay: 0.15s; }
    .flip-word-3 { animation-delay: 0.3s; }
    .flip-word-4 { animation-delay: 0.45s; }

    @keyframes odometerRoll {
      0% {
        transform: translateY(110%) rotateX(-60deg);
        opacity: 0;
      }
      100% {
        transform: translateY(0) rotateX(0deg);
        opacity: 1;
      }
    }

    /* ============================================ */
    /* HERO SECTION                                 */
    /* ============================================ */
    .hero-new {
      min-height: 90vh;
      background:
        linear-gradient(90deg, rgb(255, 255, 255) 0%, rgba(255,255,255,0.95) 35%, rgba(255,255,255,0) 55%),
        url('assets/img/hero-carousel/lai-header-op2.png') right center no-repeat;
      background-size: contain;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      text-align: left;
      padding: 11rem 5% 6rem;
      color: var(--text-dark);
      position: relative;
    }

    .hero-image {
      display: none;
    }

    .hero-image img {
      display: block;
      width: 100%;
      height: auto;
    }

    .hero-content {
      max-width: 520px;
      position: relative;
      z-index: 1;
      will-change: transform;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .hero-new h1 {
      font-size: clamp(2.5rem, 4.5vw, 4rem);
      font-weight: 700;
      margin-bottom: 1.5rem;
      line-height: 1.1;
      color: var(--text-dark);
      letter-spacing: -0.03em;
      text-shadow: 0px 8px 20px rgba(0, 0, 0, 0.08);
    }

    .street-sign-divider {
      width: 100px;
      height: 3px;
      background: linear-gradient(90deg, var(--primary-green) 0%, var(--primary-yellow) 100%);
      margin: 1.5rem 0 2.5rem;
      position: relative;
      border-radius: 3px;
    }

    /* ============================================ */
    /* RESOURCES SECTION                            */
    /* ============================================ */
    .resources-section {
      padding: 6rem 5% 7rem;
      background: var(--bg-light);
    }

    .resource-block {
      margin-bottom: 6rem;
      max-width: 1300px;
      margin-left: auto;
      margin-right: auto;
      text-align: center;
    }

    .column-subheader {
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--text-dark);
      margin-bottom: 1rem;
      display: block;
      letter-spacing: -0.02em;
    }

    .resource-desc {
      font-size: 1.15rem;
      color: var(--text-medium);
      max-width: 700px;
      margin: 0 auto 2rem auto;
      line-height: 1.6;
    }

    /* ============================================ */
    /* TOOLBAR: FILTER BUTTON + RESULT COUNT        */
    /* ============================================ */
    .infographics-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 1300px;
      margin: 0 auto 1.5rem auto;
      padding: 0 0 1.2rem 0;
      border-bottom: 1px solid rgba(0,0,0,0.08);
      text-align: left;
      position: relative;
    }

    .filter-toggle-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.7rem;
      background: none;
      border: none;
      font-family: inherit;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.04em;
      color: var(--text-dark);
      cursor: pointer;
      padding: 0.4rem 0.2rem;
    }

    .filter-toggle-btn svg {
      width: 20px;
      height: 20px;
      stroke: var(--text-dark);
    }

    .filter-toggle-btn .filter-count {
      background: var(--primary-green);
      color: #fff;
      font-size: 0.72rem;
      font-weight: 700;
      border-radius: 999px;
      padding: 0.1rem 0.5rem;
      display: none;
    }

    .filter-toggle-btn.has-active .filter-count {
      display: inline-block;
    }

    .results-count {
      font-size: 0.9rem;
      color: var(--text-light);
    }

    /* ============================================ */
    /* FILTER DROPDOWN PANEL                        */
    /* ============================================ */
    .filter-panel {
      max-width: 1300px;
      margin: 0 auto;
      background: #ffffff;
      border: 1px solid rgba(0,0,0,0.08);
      border-radius: 12px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.08);
      padding: 0 1.8rem;
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transition: max-height 0.35s ease, opacity 0.3s ease, padding 0.35s ease, margin 0.35s ease;
      text-align: left;
    }

    .filter-panel.is-open {
      max-height: 900px;
      opacity: 1;
      padding: 1.8rem;
      margin: 0 auto 2.5rem auto;
    }

    .filter-panel-group {
      margin-bottom: 1.4rem;
    }

    .filter-panel-group:last-of-type {
      margin-bottom: 0.5rem;
    }

    .filter-panel-label {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-light);
      display: block;
      margin-bottom: 0.8rem;
    }

    .filter-chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
    }

    .filter-chip {
      font-family: inherit;
      font-weight: 600;
      font-size: 0.88rem;
      color: var(--text-medium);
      background: var(--bg-light);
      border: 2px solid transparent;
      border-radius: 999px;
      padding: 0.45rem 1.1rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .filter-chip:hover {
      border-color: var(--primary-green);
      color: var(--primary-green);
    }

    .filter-chip.active {
      background: var(--primary-green);
      color: #ffffff;
    }

    .filter-panel-footer {
      display: flex;
      justify-content: flex-end;
      gap: 1rem;
      padding-top: 1.2rem;
      border-top: 1px solid rgba(0,0,0,0.06);
    }

    .filter-clear-btn {
      background: none;
      border: none;
      font-family: inherit;
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--text-light);
      cursor: pointer;
      text-decoration: underline;
    }

    .filter-clear-btn:hover {
      color: var(--text-dark);
    }

    /* ============================================ */
    /* GRID, COLLAPSE WRAPPER & FADE EFFECT         */
    /* ============================================ */
    .grid-wrapper {
      position: relative;
      max-height: 850px; /* Shows approx 2 rows depending on screen width */
      overflow: hidden;
      transition: max-height 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .grid-blur-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 250px;
      /* Removed backdrop-filter to prevent the venom shadow artifact */
      /* Made the gradient slightly sharper and opaque to handle the visual fade */
      background: linear-gradient(to bottom, rgba(248, 249, 250, 0) 0%, rgba(248, 249, 250, 0.95) 40%, rgba(248, 249, 250, 1) 100%);
      pointer-events: none;
      transition: opacity 0.5s ease;
      z-index: 2;
    }

    .infographics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.8rem 1.6rem;
      max-width: 1300px;
      margin: 0 auto;
      text-align: left;
    }

    .infographic-card {
      background: #ffffff;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(0,0,0,0.06);
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.35s ease, opacity 0.3s ease;
      display: flex;
      flex-direction: column;
      cursor: pointer;
    }

    .infographic-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 16px 32px rgba(0,0,0,0.1);
    }

    .infographic-card.is-hidden {
      display: none;
    }

    .infographic-card-media {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 10;
      background: #eeeeee;
      overflow: hidden;
    }

    .infographic-card-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.5s ease;
    }

    .infographic-card:hover .infographic-card-media img {
      transform: scale(1.04);
    }

    .infographic-card-body {
      padding: 1rem 1.1rem 1.2rem;
    }

    .infographic-title {
      display: block;
      font-weight: 700;
      color: var(--text-dark);
      font-size: 0.98rem;
      line-height: 1.4;
      margin-bottom: 0.7rem;
    }

    .infographic-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    .tag-pill {
      font-size: 0.74rem;
      font-weight: 600;
      color: var(--primary-green);
      background: rgba(19, 155, 72, 0.1);
      border-radius: 999px;
      padding: 0.22rem 0.65rem;
    }

    .no-results-msg {
      text-align: center;
      color: var(--text-light);
      font-size: 1.05rem;
      padding: 3rem 0;
      grid-column: 1 / -1;
      display: none;
    }

    .no-results-msg.is-visible {
      display: block;
    }

    /* ============================================ */
    /* VIEW MORE MINIMALIST BUTTON STYLING          */
    /* ============================================ */
    .view-more-container {
      text-align: center;
      margin-top: 1.5rem;
    }

    .view-more-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: none;
      border: none;
      font-family: inherit;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.04em;
      color: var(--text-dark);
      cursor: pointer;
      padding: 0.4rem 0.2rem;
      transition: color 0.2s ease;
    }

    .view-more-btn:hover {
      color: var(--primary-green);
    }

    .view-more-btn svg {
      width: 20px;
      height: 20px;
      stroke: var(--text-dark);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), stroke 0.2s ease;
    }

    .view-more-btn:hover svg {
      stroke: var(--primary-green);
    }

    .view-more-btn.is-active svg {
      transform: rotate(180deg);
    }

    /* ============================================ */
    /* LIGHTBOX                                     */
    /* ============================================ */
    .lightbox-overlay {
      position: fixed;
      inset: 0;
      background: rgba(10, 10, 10, 0.92);
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .lightbox-overlay.is-open {
      display: flex;
    }

    .lightbox-content {
      position: relative;
      max-width: 90vw;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .lightbox-content img {
      max-width: 90vw;
      max-height: 78vh;
      object-fit: contain;
      border-radius: 6px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .lightbox-caption {
      color: #fff;
      text-align: center;
      margin-top: 1rem;
      font-weight: 700;
      font-size: 1rem;
      max-width: 700px;
    }

    .lightbox-close {
      position: absolute;
      top: -3rem;
      right: -0.5rem;
      background: none;
      border: none;
      color: #fff;
      font-size: 2.2rem;
      line-height: 1;
      cursor: pointer;
      padding: 0.3rem;
    }

    .lightbox-nav {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.12);
      border: none;
      color: #fff;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      font-size: 1.4rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease;
    }

    .lightbox-nav:hover {
      background: rgba(255,255,255,0.25);
    }

    .lightbox-prev { left: 2rem; }
    .lightbox-next { right: 2rem; }

    /* ============================================ */
    /* RESPONSIVE DESIGN                            */
    /* ============================================ */
    @media (max-width: 767.98px) {
      .hero-new {
        min-height: auto;
        background: #ffffff;
        align-items: center;
        text-align: center;
        padding: 5.75rem 0 3.5rem;
      }
      .hero-image {
        display: block;
        width: 100%;
        margin: 0 0 1.75rem;
      }
      .hero-content {
        max-width: 100%;
        padding: 0 5%;
        align-items: center;
      }
      .hero-new h1 {
        font-size: clamp(2rem, 9vw, 3rem);
        line-height: 1.08;
        margin-bottom: 1rem;
      }
      .street-sign-divider {
        margin-left: auto;
        margin-right: auto;
        margin-bottom: 1.5rem;
      }
      .resources-section {
        padding: 5rem 5%;
      }
      .resource-block {
        margin-bottom: 4rem;
      }
      .infographics-grid {
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 1.2rem;
      }
      .lightbox-nav {
        width: 40px;
        height: 40px;
      }
      .lightbox-prev { left: 0.5rem; }
      .lightbox-next { right: 0.5rem; }
      .lightbox-close {
        top: -2.6rem;
        right: 0;
      }
    }
  </style>
</head>

  <!-- ============================================ -->
  <!-- CUSTOM SMOOTH SCROLL LOGIC                   -->
  <!-- ============================================ -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // 1. One-time Reveal on Scroll
      const revealElements = document.querySelectorAll('.scroll-reveal');
      const revealObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('is-visible');
            revealObserver.unobserve(entry.target);
          }
        });
      }, { root: null, rootMargin: '0px 0px -10% 0px', threshold: 0.1 });
      revealElements.forEach(el => revealObserver.observe(el));

      // 2. Fluid Scroll-Linked Headers (Dynamic Scaling & Odometer Reveal)
      const fluidContainers = document.querySelectorAll('.fluid-header-container');
      let ticking = false;
      function updateScrollAnimations() {
        const viewHeight = window.innerHeight;
        fluidContainers.forEach(container => {
           const inner = container.querySelector('.fluid-header-inner');
           if (!inner) return;
           const rect = container.getBoundingClientRect();
           const revealStart = viewHeight * 0.95;
           const revealEnd = viewHeight * 0.70;
           let opacity = 1; let yOffset = 0; let scale = 1;
           if (rect.top > revealStart) {
             opacity = 0; yOffset = 60; scale = 0.85;
             inner.classList.remove('is-revealed');
           } else if (rect.top > revealEnd) {
             const progress = (revealStart - rect.top) / (revealStart - revealEnd);
             const ease = 1 - Math.pow(1 - progress, 3);
             opacity = ease; yOffset = (1 - ease) * 60; scale = 0.85 + (ease * 0.15);
             inner.classList.add('is-revealed');
           } else {
             opacity = 1; scale = 1;
             const parallaxProgress = (revealEnd - rect.top) / revealEnd;
             yOffset = -(parallaxProgress * 40);
           }
           inner.style.opacity = opacity;
           inner.style.transform = `translateY(${yOffset}px) scale(${scale})`;
        });
        ticking = false;
      }
      window.addEventListener('scroll', () => { if (!ticking) { window.requestAnimationFrame(updateScrollAnimations); ticking = true; } });
      updateScrollAnimations();
    });
  </script>

    document.addEventListener("DOMContentLoaded", () => {
      const grid = document.getElementById('infographics-grid');
      const gridWrapper = document.getElementById('grid-wrapper');
      const gridBlur = document.getElementById('grid-blur-overlay');
      const viewMoreWrapper = document.getElementById('view-more-wrapper');
      const viewMoreBtn = document.getElementById('view-more-btn');

      const noResultsMsg = document.getElementById('no-results-msg');
      const resultsCount = document.getElementById('results-count');
      const filterToggleBtn = document.getElementById('filter-toggle-btn');
      const filterCount = document.getElementById('filter-count');
      const filterPanel = document.getElementById('filter-panel');
      const tagChipRow = document.getElementById('tag-chip-row');
      const filterClearBtn = document.getElementById('filter-clear-btn');

      const lightboxOverlay = document.getElementById('lightbox-overlay');
      const lightboxImage = document.getElementById('lightbox-image');
      const lightboxCaption = document.getElementById('lightbox-caption');
      const lightboxClose = document.getElementById('lightbox-close');
      const lightboxPrev = document.getElementById('lightbox-prev');
      const lightboxNext = document.getElementById('lightbox-next');

      let activeTags = new Set();
      let visibleItems = [...INFOGRAPHICS];
      let currentLightboxIndex = 0;
      let isExpanded = false;

      // Build tag chips
      const allTags = [...new Set(INFOGRAPHICS.flatMap(item => item.tags))].sort();
      allTags.forEach(tag => {
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'filter-chip';
        chip.dataset.tag = tag;
        chip.textContent = tag;
        chip.addEventListener('click', () => {
          chip.classList.toggle('active');
          activeTags.has(tag) ? activeTags.delete(tag) : activeTags.add(tag);
          renderGrid();
          updateFilterCount();
        });
        tagChipRow.appendChild(chip);
      });

      function updateFilterCount() {
        const total = activeTags.size;
        filterCount.textContent = total;
        filterToggleBtn.classList.toggle('has-active', total > 0);
      }

      function buildCard(item, index) {
        const card = document.createElement('div');
        card.className = 'infographic-card';
        card.dataset.index = index;

        const media = document.createElement('div');
        media.className = 'infographic-card-media';

        const img = document.createElement('img');
        img.src = item.img;
        img.alt = item.title;
        img.loading = 'lazy';
        media.appendChild(img);

        const body = document.createElement('div');
        body.className = 'infographic-card-body';

        const title = document.createElement('span');
        title.className = 'infographic-title';
        title.textContent = item.title;

        const tagsWrap = document.createElement('div');
        tagsWrap.className = 'infographic-tags';
        item.tags.forEach(tag => {
          const pill = document.createElement('span');
          pill.className = 'tag-pill';
          pill.textContent = tag;
          tagsWrap.appendChild(pill);
        });

        body.appendChild(title);
        body.appendChild(tagsWrap);
        card.appendChild(media);
        card.appendChild(body);

        card.addEventListener('click', () => openLightbox(index));

        return card;
      }

      function renderGrid() {
        grid.innerHTML = '';
        visibleItems = INFOGRAPHICS.filter(item => {
          return activeTags.size === 0 || item.tags.some(t => activeTags.has(t));
        });

        visibleItems.forEach((item) => {
          const realIndex = INFOGRAPHICS.indexOf(item);
          grid.appendChild(buildCard(item, realIndex));
        });

        noResultsMsg.classList.toggle('is-visible', visibleItems.length === 0);
        resultsCount.textContent = visibleItems.length + (visibleItems.length === 1 ? ' infographic' : ' infographics');

        // Check layout to toggle the view more button and blur appropriately
        isExpanded = false;
        viewMoreBtn.classList.remove('is-active');
        viewMoreBtn.innerHTML = 'VIEW MORE <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>';

        if (visibleItems.length <= 6) {
          viewMoreWrapper.style.display = 'none';
          gridBlur.style.display = 'none';
          gridWrapper.style.maxHeight = 'none';
        } else {
          viewMoreWrapper.style.display = 'block';
          gridBlur.style.display = 'block';
          gridBlur.style.opacity = '1';
          gridWrapper.style.maxHeight = '850px';
        }
      }

      // View More Button Toggle Logic using JS scrollHeight for smooth natural reveal
      const iconSvg = `<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>`;

      viewMoreBtn.addEventListener('click', () => {
        isExpanded = !isExpanded;
        if (isExpanded) {
          // Set to actual total pixel height to trigger smooth CSS transition
          gridWrapper.style.maxHeight = gridWrapper.scrollHeight + "px";
          viewMoreBtn.classList.add('is-active');
          viewMoreBtn.innerHTML = `COLLAPSE ${iconSvg}`;
          gridBlur.style.opacity = '0';

          // Once transition finishes, switch to 'none' so window resizing works properly
          setTimeout(() => {
            if (isExpanded) gridWrapper.style.maxHeight = 'none';
          }, 800);

        } else {
          // Need to lock the height to exact pixels before transitioning back down
          gridWrapper.style.maxHeight = gridWrapper.scrollHeight + "px";
          void gridWrapper.offsetHeight; // force browser reflow

          gridWrapper.style.maxHeight = '850px';
          viewMoreBtn.classList.remove('is-active');
          viewMoreBtn.innerHTML = `VIEW MORE ${iconSvg}`;
          gridBlur.style.opacity = '1';

          document.querySelector('.infographics-toolbar').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      });

      // Filter panel toggle
      filterToggleBtn.addEventListener('click', () => {
        filterPanel.classList.toggle('is-open');
      });

      filterClearBtn.addEventListener('click', () => {
        activeTags.clear();
        tagChipRow.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
        updateFilterCount();
        renderGrid();
      });

      // Lightbox logic
      function openLightbox(index) {
        currentLightboxIndex = index;
        showLightboxItem();
        lightboxOverlay.classList.add('is-open');
        document.body.style.overflow = 'hidden';
      }

      function showLightboxItem() {
        const item = INFOGRAPHICS[currentLightboxIndex];
        lightboxImage.src = item.img;
        lightboxImage.alt = item.title;
        lightboxCaption.textContent = item.title;
      }

      function closeLightbox() {
        lightboxOverlay.classList.remove('is-open');
        document.body.style.overflow = '';
      }

      function showNext(step) {
        // Navigate within the currently visible/filtered set if possible
        const pool = visibleItems.length > 0 ? visibleItems : INFOGRAPHICS;
        const currentItem = INFOGRAPHICS[currentLightboxIndex];
        let poolIndex = pool.indexOf(currentItem);
        if (poolIndex === -1) poolIndex = 0;
        poolIndex = (poolIndex + step + pool.length) % pool.length;
        currentLightboxIndex = INFOGRAPHICS.indexOf(pool[poolIndex]);
        showLightboxItem();
      }

      lightboxClose.addEventListener('click', closeLightbox);
      lightboxOverlay.addEventListener('click', (e) => {
        if (e.target === lightboxOverlay) closeLightbox();
      });
      lightboxPrev.addEventListener('click', () => showNext(-1));
      lightboxNext.addEventListener('click', () => showNext(1));

      document.addEventListener('keydown', (e) => {
        if (!lightboxOverlay.classList.contains('is-open')) return;
        if (e.key === 'Escape') closeLightbox();
        if (e.key === 'ArrowLeft') showNext(-1);
        if (e.key === 'ArrowRight') showNext(1);
      });

      // Initial render
      renderGrid();
    });
  </script>

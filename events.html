    :root {

    body {

    /* CUSTOM MOVEMENT & SCROLL ANIMATIONS */
    .scroll-reveal {
      opacity: 0;
      transform: translateY(40px) scale(0.98);
      transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1), transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: opacity, transform;
    }

    .scroll-reveal.is-visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .delay-1 { transition-delay: 0.1s; }
    .delay-2 { transition-delay: 0.2s; }
    .delay-3 { transition-delay: 0.3s; }

    /* FLUID SCROLL HEADERS */
    .fluid-header-container {
      position: relative;
      width: 100%;
    }
    
    .fluid-header-inner {
      will-change: transform, opacity;
      opacity: 0; 
      transform: translateY(60px) scale(0.85);
    }

    .section-header-center {
      text-align: center;
      margin-bottom: 5rem;
      z-index: 10;
    }

    .section-header-center h2 {
      font-size: clamp(2.2rem, 4vw, 3rem);
      font-weight: 700;
      color: var(--text-dark);
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
    }

    .section-header-center p {
      color: var(--text-medium);
      font-size: 1.15rem;
      margin-top: 1rem;
    }

    /* ODOMETER FLIP EFFECT FOR HEADERS */
    .flip-wrapper {
      display: inline-block;
      overflow: hidden; 
      vertical-align: bottom;
      padding: 0.1em; 
      margin: -0.1em;
    }

    .flip-word {
      display: inline-block;
      opacity: 0;
      transform: translateY(110%) rotateX(-45deg);
      transform-origin: 50% 50%;
      will-change: transform, opacity;
    }

    .is-visible .flip-word,
    .fluid-header-inner.is-revealed .flip-word {
      animation: odometerRoll 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    .flip-word-1 { animation-delay: 0.0s; }
    .flip-word-2 { animation-delay: 0.15s; }
    .flip-word-3 { animation-delay: 0.3s; }
    .flip-word-4 { animation-delay: 0.45s; }
    .flip-word-5 { animation-delay: 0.6s; }
    .flip-word-6 { animation-delay: 0.75s; }

    @keyframes odometerRoll {
      0% {
        transform: translateY(110%) rotateX(-60deg);
        opacity: 0;
      }
      100% {
        transform: translateY(0) rotateX(0deg);
        opacity: 1;
      }
    }

  <!-- CUSTOM SMOOTH SCROLL & AUTO-ROLL LOGIC       -->

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // 1. Bidirectional Reveal on Scroll
      const revealElements = document.querySelectorAll('.scroll-reveal');
      const revealObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('is-visible');
          } else {
            entry.target.classList.remove('is-visible');
          }
        });
      }, { root: null, rootMargin: '0px 0px -10% 0px', threshold: 0.1 });
      revealElements.forEach(el => revealObserver.observe(el));

      // 2. Fluid Scroll-Linked Headers (Dynamic Scaling & Odometer Reveal)
      const fluidContainers = document.querySelectorAll('.fluid-header-container');
      let ticking = false;
      function updateScrollAnimations() {
        const viewHeight = window.innerHeight;
        fluidContainers.forEach(container => {
           const inner = container.querySelector('.fluid-header-inner');
           if (!inner) return;
           const rect = container.getBoundingClientRect();
           const revealStart = viewHeight * 0.95;
           const revealEnd = viewHeight * 0.70;
           let opacity = 1; let yOffset = 0; let scale = 1;
           if (rect.top > revealStart) {
             opacity = 0; yOffset = 60; scale = 0.85;
             inner.classList.remove('is-revealed');
           } else if (rect.top > revealEnd) {
             const progress = (revealStart - rect.top) / (revealStart - revealEnd);
             const ease = 1 - Math.pow(1 - progress, 3);
             opacity = ease; yOffset = (1 - ease) * 60; scale = 0.85 + (ease * 0.15);
             inner.classList.add('is-revealed'); 
           } else {
             opacity = 1; scale = 1;
             const parallaxProgress = (revealEnd - rect.top) / revealEnd;
             yOffset = -(parallaxProgress * 40);
           }
           inner.style.opacity = opacity;
           inner.style.transform = `translateY(${yOffset}px) scale(${scale})`;
        });
        ticking = false;
      }
      window.addEventListener('scroll', () => { if (!ticking) { window.requestAnimationFrame(updateScrollAnimations); ticking = true; } });
      updateScrollAnimations();
    });

    // 3. Swiper Continuous Auto-Roll Initialization
    window.addEventListener('load', function () {
      if(typeof Swiper !== 'undefined') {
        const marqueeSettings = {
          spaceBetween: 24,
          centeredSlides: true,
          speed: 2000,
          autoplay: {
            delay: 0,
            disableOnInteraction: false,
          },
          loop: true,
          slidesPerView: 'auto',
          allowTouchMove: false, // Prevents dragging from breaking the smooth loop
        };

        // Top Row - Scrolls Normal (Left)
        new Swiper('#events-products-swiper-1', marqueeSettings);
      }
    });
  </script>
